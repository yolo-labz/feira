<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"
     role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">feira — o preço que você pagou, por quilo</title>
  <desc id="og-desc">Óleo de 900 ml a R$ 7,49 sai a R$ 8,32 por litro; o de 1 litro a R$ 7,90 sai a R$ 7,90 por litro. O mais barato na etiqueta é o mais caro por litro.</desc>

  <!--
    GitHub social preview, 1280x640 (2:1).

    Design constraints this file is built around, from docs/pesquisa and DESIGN.md:
      - Every crop (X ~1.91:1, Slack thumbnail, Discord) centre-crops, so nothing
        load-bearing goes near the edges. Content sits inside x 88..1192, y 72..568.
      - Under ~12 words of prose. The numbers do the arguing.
      - The card is the actual fixture data shipped in template/dados/observacoes.csv,
        so the image cannot drift away from what the tool really prints.
      - Text is converted to paths at render time (make assets), so it does not
        depend on a font being installed anywhere.
      - Colour never carries meaning alone: the winning row is green AND labelled.
  -->

  <rect width="1280" height="640" fill="#FFFFFF"/>

  <!-- wordmark row -->
  <g transform="translate(88, 78)">
    <!-- the tag mark, same geometry as logo.svg, scaled 32 -> 68 -->
    <g transform="scale(2.125)" fill="#1F2328">
      <path fill-rule="evenodd" d="
        M 12 4 H 26 A 3 3 0 0 1 29 7 V 25 A 3 3 0 0 1 26 28 H 12
        L 2.9 17.8 A 2.7 2.7 0 0 1 2.9 14.2 Z
        M 14.6 16 A 2.6 2.6 0 1 1 9.4 16 A 2.6 2.6 0 1 1 14.6 16 Z
        M 18.866 22.832 L 25.866 11.332 L 23.134 9.668 L 16.134 21.168 Z
      "/>
    </g>
    <text x="98" y="53" font-family="DejaVu Sans, Inter, system-ui, sans-serif"
          font-size="76" font-weight="700" fill="#1F2328" letter-spacing="-1.5">feira</text>
  </g>

  <text x="88" y="238" font-family="DejaVu Sans, Inter, system-ui, sans-serif"
        font-size="38" font-weight="400" fill="#57606A">O preço que você pagou, por quilo.</text>

  <!-- demonstration card: fixture data from template/dados/observacoes.csv -->
  <g transform="translate(88, 296)">
    <rect width="1104" height="272" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/>

    <text x="40" y="52" font-family="DejaVu Sans, Inter, system-ui, sans-serif"
          font-size="24" fill="#57606A">na etiqueta</text>
    <text x="1064" y="52" text-anchor="end" font-family="DejaVu Sans, Inter, system-ui, sans-serif"
          font-size="24" fill="#57606A">por litro</text>

    <!-- row 1: the 900 ml bottle that looks cheaper and is not -->
    <text x="40" y="126" font-family="DejaVu Sans, Inter, system-ui, sans-serif"
          font-size="46" font-weight="600" fill="#1F2328">óleo 900 ml</text>
    <text x="392" y="126" font-family="DejaVu Sans, Inter, system-ui, sans-serif"
          font-size="46" font-weight="400" fill="#57606A">R$ 7,49</text>
    <text x="1064" y="126" text-anchor="end" font-family="DejaVu Sans, Inter, system-ui, sans-serif"
          font-size="52" font-weight="700" fill="#1F2328">R$ 8,32</text>

    <line x1="40" y1="160" x2="1064" y2="160" stroke="#D0D7DE" stroke-width="2"/>

    <!-- row 2: the 1 L bottle, dearer on the shelf, cheaper per litre -->
    <text x="40" y="228" font-family="DejaVu Sans, Inter, system-ui, sans-serif"
          font-size="46" font-weight="600" fill="#1F2328">óleo 1 litro</text>
    <text x="392" y="228" font-family="DejaVu Sans, Inter, system-ui, sans-serif"
          font-size="46" font-weight="400" fill="#57606A">R$ 7,90</text>
    <text x="1064" y="228" text-anchor="end" font-family="DejaVu Sans, Inter, system-ui, sans-serif"
          font-size="52" font-weight="700" fill="#1A7F37">R$ 7,90</text>
    <!-- label, so the meaning does not rest on the colour green alone -->
    <text x="806" y="228" text-anchor="end" font-family="DejaVu Sans, Inter, system-ui, sans-serif"
          font-size="26" font-weight="600" fill="#1A7F37">mais barato</text>
  </g>
</svg>
